<!doctype html>
<html>
  <head>
    <title>CRDT Collaborative Editor</title>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- Sidebar for document list -->
      <div id="sidebar">
        <div id="sidebar-header">
          <h2>Documents</h2>
          <button id="new-document-btn" title="New Document">+ New</button>
        </div>
        <div id="document-list">
          <!-- Documents will be dynamically added here -->
        </div>
        <div id="users-list">
          <h3>Active Users</h3>
          <div id="users-container">
            <!-- Active users will be shown here -->
          </div>
        </div>
      </div>

      <!-- Main content area -->
      <div id="main-content">
        <div id="status-bar">
          <span id="connection-status">Connecting...</span>
          <span id="sync-status">Ready</span>
          <span id="document-title">Untitled Document</span>
        </div>
        <div id="editor-container">
          <div id="editor"></div>
          <div id="collaboration-overlay"></div>
        </div>

        <div id="controls">
          <button id="delete-document-btn">Delete Document</button>
          <button id="rename-document-btn">Rename</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
    <script type="module" src="crdt.js"></script>
    <script type="module" src="editor.js"></script>
  </body>
</html>
